version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups:
      expo: { patterns: ["expo", "expo-*", "@expo/*", "react-native", "react", "@types/react"] }
  - package-ecosystem: cargo
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/api, /infra/graphhopper, /infra/photon]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
