name: cap

# docker compose up -d                    database and API
# docker compose --profile full up -d     plus GraphHopper and Photon
# docker compose run --rm photon-import   build the Photon France database (once)

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: cap
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../api
    image: cap-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cap:${POSTGRES_PASSWORD}@db:5432/cap
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-io.github.theovil1.cap}
      GRAPHHOPPER_URL: http://graphhopper:8989
      PHOTON_URL: http://photon:2322
      BEHIND_PROXY: ${BEHIND_PROXY:-false}
      LOG_FORMAT: json
      RUST_LOG: info,tower_http=info
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

  graphhopper:
    build: ./graphhopper
    image: cap-graphhopper
    profiles: [full]
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xmx${GRAPHHOPPER_HEAP:-8g} -Ddw.graphhopper.graph.dataaccess.default_type=${GRAPHHOPPER_STORAGE:-RAM_STORE}
    volumes:
      - ./data/graphhopper:/data
    ports:
      - "127.0.0.1:8989:8989"

  photon:
    build: ./photon
    image: cap-photon
    profiles: [full]
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xmx${PHOTON_HEAP:-2g}
    volumes:
      - ./data/photon:/data
    ports:
      - "127.0.0.1:2322:2322"

  photon-import:
    build: ./photon
    image: cap-photon
    profiles: [import]
    entrypoint: ["bash", "/app/import.sh"]
    environment:
      JAVA_OPTS: -Xmx${PHOTON_HEAP:-2g}
    volumes:
      - ./data/photon:/data

volumes:
  db-data:
